# Site metadata and configuration for the Linkita Zola theme.
base_url = "https://john-cd.com"
title = "John Cruchon-Dupeyrat"
description = "Writing and project notes on data engineering, search, machine learning, and software architecture."
default_language = "en"
theme = "linkita"
compile_sass = false
generate_feeds = true
feed_filenames = ["atom.xml", "feed.xml"]
build_search_index = true
minify_html = false
author = "john-cd"

[search]
index_format = "elasticlunr_javascript"
include_title = true
include_description = true
include_content = true

[extra]
header_menu_name = "main"
header_buttons = ["site_title", "theme_button", "search_button"]
title_separator = " | "
math = false
mermaid = false
comment = false
toc = true
page_info = [{ when = "date" }, { when = "reading_time" }, { when = "authors" }]

[extra.languages.en]
locale = "en-US"
date_format = "y MMM d"

[extra.profiles.john-cd]
name = "John Cruchon-Dupeyrat"
bio = "Writing on data engineering, search, machine learning, and software architecture."
og_image = "img/social-card.png"
og_image_alt = "John Cruchon-Dupeyrat — data engineering, search, and software architecture"
social = [
  { name = "github", url = "https://github.com/john-cd" },
  { name = "rss", url = "@base/atom.xml" },
]

[extra.menus]
main = [
  { name = "About", url = "@base/about/" },
  { name = "Blog", url = "@base/blog/" },
  { name = "Projects", url = "@base/projects/" },
  { name = "CV", url = "@base/cv/" },
  { name = "Contact", url = "@base/contact/" },
  { name = "Cheatsheets", url = "https://john-cd.github.io/cheatsheets/" },
]

[extra.footer]
since = 2026
copyright = "&copy;&nbsp;$YEAR John Cruchon-Dupeyrat. All rights reserved."
privacy_policy_url = "@base/privacy-policy/"
