# Project-scoped Compose stack: john-cd-github-io.
# Build inputs come from tracked .devcontainer/.env; from the repo root pass --env-file .devcontainer/.env.
# Keep credentials in ignored .devcontainer/.env.local; from the repo root pass it as a second --env-file when present.
name: john-cd-github-io
services:
  john-cd-github-io-site:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        ZOLA_VERSION: "${ZOLA_VERSION:?Set ZOLA_VERSION in .devcontainer/.env}"
        ZOLA_SHA256: "${ZOLA_SHA256:?Set ZOLA_SHA256 in .devcontainer/.env}"
    init: true
    command: ["sleep", "infinity"]
    volumes:
      - ..:/workspaces/john-cd.github.io:cached
    environment:
      SITE_SERVE_INTERFACE: 0.0.0.0
      SITE_SERVE_PORT: "1111"
    ports:
      - "127.0.0.1:1111:1111"
