# Build and validate both branches; publish GitHub Pages only from a push to the release branch.
name: Build and publish site

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  # The build only needs to read the repository and its theme submodule.
  contents: read

# Cancel obsolete runs on the same ref so a newer source revision takes priority.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pull requests and pushes use the same validated artifact build.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site and theme
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Install Zola supported by Linkita
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.87.30
        with:
          tool: zola@0.23.6
          fallback: none
      - name: Check content and external links
        run: zola check
      - name: Build site
        run: zola build
      - name: Preserve feed routes when no posts are public
        run: python3 scripts/fill_empty_feeds.py
      - name: Check generated routes and assets
        run: python3 scripts/check_site.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    # Only a successful push build on main can publish to GitHub Pages.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
