# Workflow contract documentation (maintained with the implementation).
# Workflow contract: john-cd.github.io / Build and publish site.
# Purpose: Build or validate the maintained documentation and generated output; Deploy the checked
# site or application through the configured destination.
# Execution: workflow_dispatch, pull_request, push. Trigger branches/paths below are the
# authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# Build and validate both branches; publish GitHub Pages only from a push to the release branch.
name: Build and publish site

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  # The build only needs to read the repository and its theme submodule.
  contents: read

# Cancel obsolete runs on the same ref so a newer source revision takes priority.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job build: Build or validate the maintained documentation and generated output.
  # Rendering catches broken configuration, includes and generated links that a source formatter
  # cannot detect.
  build:
    timeout-minutes: 30
    # Pull requests and pushes use the same validated artifact build.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site and theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # Install the tool versions consumed by the following checks. Prefer the existing prebuilt
      # installer path to recompiling development tools on every fresh runner.
      - name: Install Zola supported by Linkita
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: zola@0.23.6
          fallback: none
      - name: Check content and external links
        run: zola check
      - name: Build site
        run: zola build
      - name: Preserve feed routes when no posts are public
        run: python3 scripts/fill_empty_feeds.py
      - name: Check generated routes and assets
        run: |
          python3 -B -m unittest discover -s scripts -p test_check_site.py
          python3 scripts/check_site.py
      # Transfer this job output to the next consumer or retain diagnostics. Uploading an artifact
      # alone does not execute the deployment job.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

  # Job deploy: Deploy the checked site or application through the configured destination.
  # This job can change a live environment; keep its condition, permissions and environment
  # protections together.
  # Dependency boundary: "build"; downstream work must not consume an unchecked or missing upstream
  # result.
  # Guard: github.event_name == 'push' && github.ref == 'refs/heads/main'. Keep this condition when
  # refactoring triggers or job dependencies.
  deploy:
    timeout-minutes: 30
    # Only a successful push build on main can publish to GitHub Pages.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # The repository's github-pages environment must allow main to deploy.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This is a publication boundary. Preserve its preceding validation, existing event/ref guard,
      # environment approvals and write permissions.
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
