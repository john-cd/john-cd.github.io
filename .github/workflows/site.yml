# Validate both branches and publish GitHub Pages only from the release branch.
name: Build and publish site

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site and theme
        uses: actions/checkout@v6.0.1
        with:
          submodules: recursive
      - name: Install pinned Zola
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.87.30
        with:
          tool: zola@0.19.2
          fallback: none
      - name: Check content and external links
        run: zola check
      - name: Build site
        run: zola build
      - name: Preserve feed routes when no posts are public
        run: python3 scripts/fill_empty_feeds.py
      - name: Check generated routes and assets
        run: python3 scripts/check_site.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
