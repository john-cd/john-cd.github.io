# Workflow contract documentation (maintained with the implementation).
# Workflow contract: john-cd.github.io / CodeQL.
# Purpose: Analyze source or dependencies for the security policy configured below.
# Execution: workflow_dispatch, push, pull_request, schedule. Trigger branches/paths below are the
# authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"actions": "read", "contents": "read", "security-events":
# "write"}; job-level overrides below own any elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# Scan maintained Python scripts and any first-party JavaScript code.
name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job analyze: Analyze source or dependencies for the security policy configured below.
  # Security data can change without a source edit; scheduled/manual triggers complement
  # change-triggered checks where configured.
  analyze:
    timeout-minutes: 30
    name: Analyze maintained code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript, python
          queries: security-extended
      - name: Analyze code
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
