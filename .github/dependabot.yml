# Keep the repository's Actions, submodule, container, and Dev Container dependencies current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # CodeQL initialization and analysis must use the same action version.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: tuesday

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: wednesday

  - package-ecosystem: devcontainers
    # Dependabot discovers .devcontainer/devcontainer.json from the repository root.
    directory: /
    schedule:
      interval: weekly
      day: wednesday
