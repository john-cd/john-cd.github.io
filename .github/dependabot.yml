# Keep the repository's Actions, submodule, container, and Dev Container dependencies current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: tuesday

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: wednesday

  - package-ecosystem: devcontainers
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: wednesday
